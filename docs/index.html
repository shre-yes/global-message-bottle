<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Message In A Bottle</title>
    <!-- Use Inter font for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-accent: #3b82f6;
            --primary-hover: #2563eb;
            --glass-blur: blur(12px);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: var(--text-color);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        /* Fluid Typography and Gradients */
        h1 {
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-align: center;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-weight: 300;
            color: #94a3b8;
            margin-bottom: 2rem;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Glassmorphism effects */
        .compose-section, .messages-section {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-color);
            padding: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-accent);
        }

        button {
            margin-top: 1rem;
            background-color: var(--primary-accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Message Display Styling */
        .message-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            animation: fadeIn 0.5s ease-out;
            word-wrap: break-word;
        }

        .message-card:last-child {
            margin-bottom: 0;
        }

        .message-content {
            margin: 0 0 0.5rem 0;
            line-height: 1.5;
            white-space: pre-wrap; /* Keeps breaks formatting */
        }

        .message-meta {
            font-size: 0.8rem;
            color: #64748b;
            text-align: right;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-text {
            color: #ef4444; 
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Message In A Bottle</h1>
            <p class="subtitle">An anonymous wall for the world</p>
        </header>

        <section class="compose-section">
            <textarea id="message_input" placeholder="What's on your mind?..." aria-label="Message Context"></textarea>
            <button id="submit_btn">Cast into the Sea</button>
        </section>

        <section class="messages-section">
            <div id="messages_list">
                <!-- Javascript will inject entries here -->
            </div>
        </section>
    </div>

    <script>
        // Use localhost for Phase 1. 
        // This will be replaced by the VM's public IP Address in Phase 5.
        const API_URL = "http://localhost:8000";

        const messageInput = document.getElementById("message_input");
        const submitBtn = document.getElementById("submit_btn");
        const messagesList = document.getElementById("messages_list");

        // Formats timestamps into readable localized format
        function format_date(date_str) {
            const date = new Date(date_str + "Z"); // Append Z to DB string to treat as UTC
            return new Intl.DateTimeFormat('en-US', {
                dateStyle: 'medium',
                timeStyle: 'short'
            }).format(date);
        }

        // Basic HTML escape to prevent XSS
        function escape_html(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        // DOM constructor for a newly minted message card
        function build_message_card(msg) {
            const card = document.createElement("div");
            card.className = "message-card";
            
            const content = document.createElement("p");
            content.className = "message-content";
            content.innerHTML = escape_html(msg.content);

            const meta = document.createElement("div");
            meta.className = "message-meta";
            meta.textContent = format_date(msg.timestamp);

            card.appendChild(content);
            card.appendChild(meta);
            return card;
        }

        // Retrieve and render messages from the FastAPI backend
        async function fetch_messages() {
            try {
                const response = await fetch(`${API_URL}/messages`);
                if (!response.ok) throw new Error("Fetch failed");
                
                const payload = await response.json();
                messagesList.innerHTML = "";
                
                if (payload.length === 0) {
                    messagesList.innerHTML = "<p style='text-align:center; color:#64748b;'>No messages yet. Be the first!</p>";
                    return;
                }
                
                payload.forEach(msg => {
                    messagesList.appendChild(build_message_card(msg));
                });
            } catch (error) {
                console.error("Fetch API error:", error);
                messagesList.innerHTML = `<p class="alert-text">Could not connect to backend.</p>`;
            }
        }

        // Transmit text to creation endpoint and refresh views
        async function submit_message() {
            const text = messageInput.value.trim();
            if (!text) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "Casting...";

            try {
                const response = await fetch(`${API_URL}/messages`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: text })
                });

                if (!response.ok) throw new Error("Post failed");

                messageInput.value = "";
                await fetch_messages();
            } catch (error) {
                console.error("Create API error:", error);
                alert("Failed to send message. Is the backend running on port 8000?");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Cast into the Sea";
            }
        }

        // Attach interactive bindings
        submitBtn.addEventListener("click", submit_message);
        
        messageInput.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                submit_message();
            }
        });

        // Initialize state on page load
        fetch_messages();
    </script>
</body>
</html>
